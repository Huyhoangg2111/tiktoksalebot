services:
  tiktok-sales-bot:
    container_name: tiktok-sales-bot
    build:
      context: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: "production"
      PW_SIGNER_INTERNAL_ENABLED: "true"
      PW_SIGNER_HEADLESS: "${PW_SIGNER_HEADLESS:-true}"
      PW_SIGNER_HOST: "127.0.0.1"
      PW_SIGNER_PORT: "${PW_SIGNER_PORT:-8092}"
      PW_SIGNER_AUTO_LOGIN_ON_STARTUP: "${PW_SIGNER_AUTO_LOGIN_ON_STARTUP:-true}"
      PW_SIGNER_CHROMIUM_ARGS: "${PW_SIGNER_CHROMIUM_ARGS:---disable-dev-shm-usage,--no-zygote}"
      DATABASE_PATH: "/app/runtime/bot_data.db"
      PW_SIGNER_STATE_PATH: "/app/runtime/playwright-signer/session.json"
      HTTP_TIMEOUT_MS: "${HTTP_TIMEOUT_MS:-30000}"
      HTTP_MAX_RETRIES: "${HTTP_MAX_RETRIES:-2}"
      SCHEDULER_LEVEL1_TIMEOUT_MINUTES: "${SCHEDULER_LEVEL1_TIMEOUT_MINUTES:-10}"
      SCHEDULER_LEVEL2_TIMEOUT_MINUTES: "${SCHEDULER_LEVEL2_TIMEOUT_MINUTES:-20}"
      SCHEDULER_LEVEL3_TIMEOUT_MINUTES: "${SCHEDULER_LEVEL3_TIMEOUT_MINUTES:-30}"
    volumes:
      - ./runtime:/app/runtime
    shm_size: 1gb
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"


  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: tiktok-sales-cloudflared
    restart: unless-stopped
    depends_on:
      - tiktok-sales-bot
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
