services:
  tiktok-sales-bot:
    container_name: tiktok-sales-bot
    build:
      context: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: "production"
      DATABASE_PATH: "/app/runtime/bot_data.db"
      HTTP_TIMEOUT_MS: "${HTTP_TIMEOUT_MS:-30000}"
      HTTP_MAX_RETRIES: "${HTTP_MAX_RETRIES:-2}"
      ADMIN_WEB_PORT: "8080"
      ADMIN_WEB_USERNAME: "${ADMIN_WEB_USERNAME:-admin}"
      ADMIN_WEB_PASSWORD: "${ADMIN_WEB_PASSWORD:-}"
      SCHEDULER_LEVEL1_TIMEOUT_MINUTES: "${SCHEDULER_LEVEL1_TIMEOUT_MINUTES:-10}"
      SCHEDULER_LEVEL2_TIMEOUT_MINUTES: "${SCHEDULER_LEVEL2_TIMEOUT_MINUTES:-20}"
      SCHEDULER_LEVEL3_TIMEOUT_MINUTES: "${SCHEDULER_LEVEL3_TIMEOUT_MINUTES:-30}"
    ports:
      - "127.0.0.1:${ADMIN_WEB_PORT:-8080}:8080"
    volumes:
      - ./runtime:/app/runtime
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"


  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: tiktok-sales-cloudflared
    restart: unless-stopped
    depends_on:
      - tiktok-sales-bot
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
